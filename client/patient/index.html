<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SMART@Home patient app demo: daily check-ins, medicines and breathing tests (synthetic data)." />
    <meta name="color-scheme" content="light dark" />
    <title>SMART@Home</title>
    <script>
      // Apply the saved colour theme before first paint (same key as the clinician view).
      try {
        var t = localStorage.getItem('smart-home-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.setAttribute('content', t);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/patient/src/main.tsx"></script>
  </body>
</html>
